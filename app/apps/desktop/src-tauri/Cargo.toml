[package]
name = "requirement-storm"
version = "0.1.0"
description = "Requirement Storm desktop shell"
authors = ["Requirement Storm"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "requirement_storm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Optional: real Steamworks path. CI leaves this off so the SDK is not required.
steamworks = { version = "0.13.1", optional = true }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Desktop-with-Steam. Links steamworks and runs SteamAPI_Init / Shutdown.
steam = ["dep:steamworks"]
